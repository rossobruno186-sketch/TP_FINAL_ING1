<!DOCTYPE html>
<html Lang="en">
    <head>

        <title>Registro - Mesa de Ayuda</title>
        <style type="text/css">

            form { width: 500px; border: 1px solid black; }
            input { margin: 7px; padding: 2px; } 
            .form-label { margin-bottom: 0!important; }

<body>

            </tr>
            <tr><td>&nbsp;</td></tr>
            <tr style="height:10px;">
                <td><label class="form-label">Contraseña</label></td>               
            </tr>

                <td><input class="txt" name="password" id="password" type="password" placeholder="Contraseña"><br></td>
            </tr>
            <tr><td><br></td></tr>
            <tr>
                <td><center><a href="http://127.0.0.1:5500/HTML/loginClient.html">¿Ya tienes una cuenta? Inicia sesión</a></center></td>
            </tr>
            <tr><td><br><input name="termscondition" id="termscondition" type="checkbox"> Acepto los términos y condiciones</p></br></td></tr>
            <tr><td><span id="resultado"></span></td></tr>
        </table>
        
        <button type="submit">Registrarse</button>
        <br><br>
    </form>
    </center>

    <!-- Script para la lógica del registro --> 
    <script src="registroClient.js" type="module"></script>
</body>
</html>
